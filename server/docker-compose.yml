services:
  tileserver:
    # 버전 태그 고정 — digest 핀은 docker save/load 시 레지스트리 메타데이터가 유실되므로
    # 에어갭 번들 호환을 위해 명시적 버전 태그를 사용한다.
    image: maptiler/tileserver-gl:v5.6.0
    platform: linux/amd64        # 폐쇄망 x86_64와 동일 아키텍처 강제 (Apple Silicon에서도 에뮬레이션 구동)
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../tiles:/data/tiles:ro
      - ../style/glyphs:/data/glyphs:ro
      - ../style:/data/styles/cuvia:ro
      - ./tileserver-config.json:/data/config.json:ro
    command: ["--config", "/data/config.json"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cuvia

  demo:
    # 버전 태그 고정 — digest 핀은 docker save/load 시 레지스트리 메타데이터가 유실되므로
    # 에어갭 번들 호환을 위해 명시적 버전 태그를 사용한다.
    image: nginx:1.31.1-alpine
    platform: linux/amd64
    restart: unless-stopped
    # 호스트 포트 미노출 — 데모는 게이트웨이(/ , /demo/) 경유로만 접근.
    # 단독 :8081 은 /styles·/data·/geocode 프록시가 없어 타일/검색이 동작하지 않으므로 노출하지 않는다.
    volumes:
      - ../demo:/usr/share/nginx/html/demo:ro
      - ../vendor:/usr/share/nginx/html/vendor:ro
      - ./demo-nginx.conf:/etc/nginx/conf.d/default.conf:ro   # sendfile off (dataless 0바이트 회피)
    networks:
      - cuvia

  geocode:
    # 지오코딩/역지오코딩 API — 무의존(파이썬 표준 라이브러리만). geocode/geocode.sqlite 서빙.
    image: python:3.12-alpine
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ../geocode:/data/geocode:ro
      - ./geocode-api.py:/app/geocode-api.py:ro
    environment:
      GEOCODE_DB: /data/geocode/geocode.sqlite
      GEOCODE_PORT: "8082"
    command: ["python3", "/app/geocode-api.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8082/health').getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cuvia

  # ── PostGIS 지오코더 (Phase 5 — 5b shadow / 5c 전환) ─────────────
  # SQLite 지오코더(geocode:8082)와 병행. 8092 로 노출해 질의 parity 측정(scripts/13d-geocode-parity.py).
  # 5c 전환 시 게이트웨이 /geocode·/reverse upstream 을 geocode-pg:8082 로 바꾼다.
  # ※air-gap: 런타임 pip 대신 psycopg 를 베이크한 이미지 필요(Phase 6 패키징).
  geocode-pg:
    image: cuvia-geocode-pg:local        # psycopg 베이크(geocode-pg.Dockerfile). 빌드호스트=compose 자동빌드, 폐쇄망=docker load
    build:
      context: .
      dockerfile: geocode-pg.Dockerfile
    platform: linux/amd64
    profiles: ["postgis"]
    restart: unless-stopped
    ports:
      - "8092:8082"   # shadow 비교용(폐쇄망 전환 후 제거)
    environment:
      DATABASE_URL: postgresql://${PGUSER:-cuvia}:${PGPASSWORD:-cuvia}@postgis:5432/${PGDATABASE:-cuvia}
      GEOCODE_PORT: "8082"
    volumes:
      - ./geocode-api-pg.py:/app/geocode-api-pg.py:ro   # dev override(이미지에도 COPY됨)
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - cuvia

  # ── PostGIS 데이터 백본 (동적 레이어·공간분석·지오코더) ────────────
  # profiles:[postgis] — 일반 지도 납품은 미가동(가벼움), 관제/분석 배포에서만 켠다.
  #   docker compose --profile postgis up
  postgis:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    profiles: ["postgis"]
    restart: unless-stopped
    # PostgreSQL 튜닝 — 기본 compose 값은 소형 머신(≈8GB)에서도 안전하면서 postgres 순정 기본값(shared_buffers 128MB·
    # maintenance 64MB·work_mem 4MB)보다 크게 개선. 대형 빌드호스트(예 128GB)는 .env/환경변수로 상향(권장값:
    # scripts/postgis/README.md §0). 전부 영속 안전값 — fsync/synchronous_commit 등 위험옵션은 미포함
    # (벌크적재 가속은 load_parcel.sh 가 세션단위 synchronous_commit=off 로 처리, 서빙 내구성 유지).
    shm_size: ${PG_SHM:-1g}                              # 병렬 워커 공유메모리(Docker 기본 64MB는 병렬쿼리/대용량 work_mem에 부족)
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}         # 128GB 호스트: 16GB~32GB
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-3GB}  # 128GB 호스트: 96GB (플래너 힌트 — OS page cache 포함 추정)
      - -c
      - maintenance_work_mem=${PG_MAINT_MEM:-512MB}      # 128GB 호스트: 8GB (39.6M GiST/btree 인덱스 빌드 가속)
      - -c
      - work_mem=${PG_WORK_MEM:-32MB}                    # 128GB 호스트: 128MB (공간조인/정렬 인메모리)
      - -c
      - max_wal_size=${PG_MAX_WAL:-4GB}                  # 128GB 호스트: 16GB (벌크적재 중 체크포인트 빈도↓)
      - -c
      - min_wal_size=${PG_MIN_WAL:-1GB}
      - -c
      - checkpoint_completion_target=0.9                 # 체크포인트 I/O 분산
      - -c
      - max_parallel_workers_per_gather=${PG_PARALLEL:-4}
      - -c
      - max_parallel_maintenance_workers=${PG_PARALLEL_MAINT:-4}   # 병렬 인덱스 빌드(btree)
      - -c
      - random_page_cost=1.1                             # SSD/NVMe (HDD면 4.0)
    environment:
      POSTGRES_USER: ${PGUSER:-cuvia}
      POSTGRES_PASSWORD: ${PGPASSWORD:-cuvia}
      POSTGRES_DB: ${PGDATABASE:-cuvia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 호스트 5433→컨테이너 5432. 기본 5433 = 빌드호스트의 기존 host PostgreSQL(5432)과 충돌 회피.
      # (컨테이너 내부는 항상 5432 — martin/geocode-pg 는 postgis:5432 로 접속). 다른 포트면 PGPORT 로 덮어쓰기.
      - "${PGPORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-cuvia} -d ${PGDATABASE:-cuvia}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - cuvia

  # ── martin — PostGIS live MVT 타일서버 (동적 레이어) ──────────────
  # 베이스/지형/글리프/스프라이트는 tileserver-gl 이 전담(존치). martin 은 /dyn 만 담당.
  # L1 캐시=martin Moka(인메모리). L2 영속 캐시는 게이트웨이 nginx proxy_cache(디스크).
  martin:
    image: ghcr.io/maplibre/martin:v0.18.0
    platform: linux/amd64
    profiles: ["postgis"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${PGUSER:-cuvia}:${PGPASSWORD:-cuvia}@postgis:5432/${PGDATABASE:-cuvia}
    volumes:
      - ./martin-config.yaml:/config/martin.yaml:ro   # 명시 table 소스(tiger·파티션자식 제외)+minzoom
    command: ["--config", "/config/martin.yaml"]
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - cuvia

  # 단일 도메인 게이트웨이(reverse proxy) — 모든 서비스를 한 포트로 통합. 공개망 권장.
  # GATEWAY_PORT 기본 80. 게이트웨이만 노출하려면 위 서비스들의 ports 매핑을 제거하면 됨.
  gateway:
    image: nginx:1.31.1-alpine
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./gateway-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - martin_cache:/data/cache/martin          # L2 영속 타일캐시(/dyn). martin 재기동에도 유지
    depends_on:
      - tileserver
      - demo
      - geocode
    networks:
      - cuvia

networks:
  cuvia:
    driver: bridge

volumes:
  pgdata:          # PostGIS 데이터 디렉토리(profile=postgis)
  martin_cache:    # 게이트웨이 nginx 디스크 타일캐시(L2 영속)
