# 단일 도메인 게이트웨이 — 모든 지도 서비스를 한 origin/포트로 통합(reverse proxy).
#   /                      → demo (정적 페이지·/vendor)
#   /styles /data /fonts /sprites → tileserver (타일·스타일·글리프)
#   /geocode /reverse      → geocode (검색)
# tileserver가 프록시 뒤에서 스타일 내부 URL(glyphs/sprite/sources)을 공개주소로 만들도록
# X-Forwarded-Host/Proto 와 Host 를 전달한다. (Style Studio는 관리툴이라 별도 포트 8091 유지)
#
# ★ 중요: tileserver-gl은 Host 의 '호스트명'만 쓰고 비표준 포트는 떨어뜨린다(→ 80 가정).
#   - 게이트웨이를 포트 80(http)로 띄우면 그대로 정확히 동작.
#   - https(443) 또는 비표준 포트(예: 8088)로 띄우면 스타일 내부 URL의 포트/스킴이 어긋난다.
#     이 경우 server/tileserver-config.json 의 "options"에 publicUrl 을 명시:
#       "options": { ..., "publicUrl": "https://maps.example.com/" }
#
# upstream 을 변수로 두고 resolver(도커 내장 DNS 127.0.0.11)로 '요청 시점' 해석 →
# 시작 시 특정 서비스가 아직 안 떠 있어도 nginx 가 크래시("host not found in upstream")하지 않음.
server {
    listen 80;
    server_name _;
    client_max_body_size 8m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── 지도 데이터(tileserver) ─────────────────────────────────
    location ~ ^/(styles|data|fonts|sprites)/ {
        set $up_tile tileserver;
        proxy_pass http://$up_tile:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # ── 지오코딩(geocode) ───────────────────────────────────────
    location ~ ^/(geocode|reverse)(/|$|\?) {
        set $up_geo geocode;
        proxy_pass http://$up_geo:8082$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 데모(정적) + 그 외 ──────────────────────────────────────
    location / {
        set $up_demo demo;
        proxy_pass http://$up_demo:80$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
