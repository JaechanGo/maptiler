# 단일 도메인 게이트웨이 — 모든 지도 서비스를 한 origin/포트로 통합(reverse proxy).
#   / , /info              → demo (연동 가이드 guide.html) · /demo/ = 인터랙티브 데모 · /vendor
#   /styles /data /fonts /sprites /files → tileserver (타일·스타일·글리프·가이드 라이브맵 자산)
#   /geocode /reverse      → geocode (검색)
# tileserver가 프록시 뒤에서 스타일 내부 URL(glyphs/sprite/sources)을 공개주소로 만들도록
# Host 를 '포트 포함' 원본 그대로 전달한다. (Style Studio는 관리툴이라 별도 포트 8091 유지)
#
# ★ 중요: tileserver-gl v5.x 는 Host 헤더의 '포트를 그대로 유지'해 스타일 내부 URL을 만든다.
#   → 반드시 $http_host(포트 포함, 예: localhost:8088)를 넘겨야 한다.
#     $host 는 포트를 떼므로(localhost) 내부 URL이 http://localhost/(:80)이 되어 깨진다.
#   → $http_host 로 넘기면 접속 호스트/포트(localhost:8088, 192.168.x:8088 등)에 맞춰
#     자동으로 정확한 URL이 생성된다(환경별 publicUrl 하드코딩 불필요).
#   → HTTPS 종단(TLS terminator) 뒤라면 X-Forwarded-Proto 가 https 로 오도록 별도 설정 필요.
#
# upstream 을 변수로 두고 resolver(도커 내장 DNS 127.0.0.11)로 '요청 시점' 해석 →
# 시작 시 특정 서비스가 아직 안 떠 있어도 nginx 가 크래시("host not found in upstream")하지 않음.
# (martin 도 동일 — profile=postgis 미가동 시 /dyn 은 502 만 반환하고 게이트웨이는 정상)
#
# ── L2 영속 타일캐시(http 컨텍스트) ──────────────────────────────────
# martin 자체 캐시(Moka)는 인메모리라 재기동 시 소실 → /dyn 응답을 디스크에 캐시해 영속화.
# 볼륨 martin_cache:/data/cache/martin (docker-compose). 무효화는 빌드별 URL 네임스페이스(/dyn/v<build>/).
proxy_cache_path /data/cache/martin levels=1:2 keys_zone=martin_cache:50m
                 max_size=2g inactive=7d use_temp_path=off;

# >>> GENERATED cache (style/theme.json) — build_style.py가 생성, 수기수정 금지 >>>
map $uri $static_cc {
    default              "public, max-age=300, stale-while-revalidate=3600";
    ~^/(fonts|sprites)/  "public, max-age=604800";
}
map $request_uri $dyn_cc { default "public, max-age=3600, stale-while-revalidate=86400"; }
# <<< GENERATED <<<

server {
    listen 80;
    server_name _;
    client_max_body_size 8m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── 지도 데이터(tileserver) ─────────────────────────────────
    # files = tileserver paths.files(/files/maplibre-gl.js·css) — 가이드 라이브맵 자산을
    #   :8080 직결·게이트웨이 모두 같은 상대경로(/files/…)로 받게 프록시에 포함.
    location ~ ^/(styles|data|fonts|sprites|files)/ {
        set $up_tile tileserver;
        proxy_pass http://$up_tile:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # 스타일 내부 /dyn/* (martin 동적타일=건물·필지·POI)는 인라인 tiles 라 tileserver 가
        # 절대화하지 않고 상대경로(/dyn/...)로 남는다. maplibre 워커는 base URL 이 없어 상대경로를
        # 못 풀어 건물·필지·POI 가 로드 실패한다. → tileserver 가 다른 소스에 쓰는 것과 동일 규칙
        # (접속 호스트 $http_host 추종)으로 여기서 절대화한다. 프론트 transformRequest 불필요·하드코딩 없음.
        proxy_set_header Accept-Encoding "";   # sub_filter 가 평문 바디를 보도록 업스트림 압축 비활성
        sub_filter_once off;                   # 3개 소스(building/parcel/poi) 모두 치환
        sub_filter_types application/json;      # style.json (기본 text/html 외 JSON 도 대상)
        sub_filter '"/dyn/' '"$scheme://$http_host/dyn/';
        add_header Cache-Control $static_cc always;
    }

    # ── 지오코딩(geocode) ───────────────────────────────────────
    # Phase 5c: SQLite 지오코더(geocode) → PostGIS 지오코더(geocode-pg)로 전환.
    #   geocode-pg 는 profiles:[postgis] 라 --profile postgis 가동 시에만 존재 → resolver 로
    #   '요청 시점' 해석(미가동 시 게이트웨이 크래시 없이 502). 내부 포트는 동일 8082.
    location ~ ^/(geocode|reverse)(/|$|\?) {
        set $up_geo geocode-pg;
        proxy_pass http://$up_geo:8082$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 동적 벡터타일(martin, PostGIS live MVT) ─────────────────
    # /dyn/<source>/{z}/{x}/{y} → martin /<source>/{z}/{x}/{y}. L2 디스크캐시 적용.
    # /dyn/v<build>/... 네임스페이스(선택)로 데이터 재적재 시 캐시 자연 교체(versioned 무효화).
    # 명명 캡처를 proxy_pass 에 직접 넘김(변수 upstream+rewrite 조합의 URI 유실 회피).
    location ~ ^/dyn/(?:v[0-9A-Za-z._-]+/)?(?<mart_path>.*)$ {
        set $up_martin martin;
        proxy_pass http://$up_martin:3000/$mart_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache martin_cache;
        proxy_cache_key $request_uri;        # 원본 URI(=버전 포함)로 키 → /dyn/v<build>/ 버전별 캐시 분리(무효화)
        proxy_cache_valid 200 204 7d;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control $dyn_cc always;
    }

    # ── 데모(정적) + 그 외 ──────────────────────────────────────
    # 루트 '/' 와 '/info' 는 별도 location 없이 여기로 떨어져 demo 컨테이너가 처리한다
    #   (demo-nginx.conf 의 `location = /` · `= /info` → /demo/guide.html). 그 계약이 demo 쪽에 있음에 유의.
    location / {
        set $up_demo demo;
        proxy_pass http://$up_demo:80$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
