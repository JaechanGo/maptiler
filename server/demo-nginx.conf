server {
    listen       80;
    server_name  localhost;

    # sendfile 비활성화 — iCloud/네트워크FS(Docker Desktop virtiofs)에서 dataless 파일을
    # sendfile() 로 보낼 때 본문이 0바이트로 끊기는 문제 회피(에러: "Resource deadlock would occur").
    # read() 경로로 전송해 vendor/glyphs 오프라인 자산이 비어 보이는 것을 방지한다.
    sendfile     off;

    root         /usr/share/nginx/html;

    # 연동 가이드 — 게이트웨이 / 와 /info 에 노출(루트는 원래 비어있어 순수 추가).
    # tileserver(:8080/ frontPage)와 동일한 demo/guide.html 단일 소스를 서빙한다.
    location = / {
        try_files /demo/guide.html =404;
    }
    location = /info {
        try_files /demo/guide.html =404;
    }

    # /demo/ = 인터랙티브 전체화면 데모, /vendor 등 그 외 정적 자산
    location / {
        index  index.html;
    }
}
