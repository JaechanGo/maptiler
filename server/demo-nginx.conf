server {
    listen       80;
    server_name  localhost;

    # sendfile 비활성화 — iCloud/네트워크FS(Docker Desktop virtiofs)에서 dataless 파일을
    # sendfile() 로 보낼 때 본문이 0바이트로 끊기는 문제 회피(에러: "Resource deadlock would occur").
    # read() 경로로 전송해 vendor/glyphs 오프라인 자산이 비어 보이는 것을 방지한다.
    sendfile     off;

    root         /usr/share/nginx/html;

    location / {
        index  index.html;
    }
}
